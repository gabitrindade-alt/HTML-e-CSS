<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><tags class="03"></tags></title>
</head>
<body>
    <form action="/cadastro" method="post">
         <h1>Cotação de Seguro de Veículo</h1>
<fieldset>
<legend>Condutor</legend>
<label for="Nome do Proprietário:">Nome do Proprietário:</label>
<input type="text" name="nome" id="Nome_propri.">
<br><br>

<label for="CNH:">CNH:</label>
<input type="text" name="nome" id="CNH">
<br><br>

<label for="Data de Emissão da CNH:">Data de Emissão da CNH:</label>
<input type="date" name="" id="">
<br><br>

<label for="Estado Civil:">Estado Civil:</label><br><br>
<input type="radio" name="nome" id="Solteiro">
<label for="">Solteiro</label>

<input type="radio" name="nome" id="Casado">
<label for="">Casado</label>

<input type="radio" name="nome" id="Divorciado">
<label for="">Divorciado</label>

<input type="radio" name="nome" id="Viúvo">
<label for="">Viúvo</label>
<br><br>

</fieldset><br>

<fieldset>
    <legend>Veículo</legend>
    <label for="Placa de Carro:">Placa de Carro:</label>
    <input type="text" name="nome" id="P.Carro" placeholder="ABC-1234">
    <br><br>

    <label for="Marca do Veículo:">Marca do Veículo:</label>
    <select name="" id="">
        <option value="">Fiat</option>
        <option value="">VW</option>
        <option value="">Chevrolet</option>
        <option value="">Toyota</option>
        <option value="">Honda</option>
        <option value="">Outro</option>
    </select>
    <br><br>

    <label for="Ano do Modelo:">Ano do Modelo:</label>
    <input type="text" name="nome" id="A.Manhã">
</fieldset><br>

<fieldset>
    <legend>Uso</legend>
    <label for="Usa o carro para trabalhar (Uber/Taxi)?">Usa o carro para trabalhar (Uber/Taxi)?</label>
    <br><br>

<input type="radio" name="nome" id="Sim">
<label for="Sim">Sim</label>

<input type="radio" name="nome" id="Não">
<label for="Não">Não</label>
<br><br>

<input type="checkbox" name="Rastreador" id="Rastreador">
<label for="Possui rastreador instalado">Possui rastreador instalado</label>
<br><br>
</fieldset><br>

<button>Solicitar Citação</button>
 </form>

</body>
</html>
