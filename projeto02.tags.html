<h1>Finalizar Compra</h1>
<fieldset>

<legend>Endereço de Entrega</legend>
<form action="/cadastro" method="post">
<label for="nome">Nome do Destinário:</label>
<input type="text" id="nome" name="nome">
<br><br>

<label for="nome">CEP:</label>
<input type="text" name="nome" id="nome" placeholder="00000-0000">
<br><br>

<label for="Rua:">Rua:</label>
<input type="text" name="nome" id="nome">
<br><br>

<label for="Número:">Número:</label>
<input type="text" name="nome" id="nome">
<br><br>

<label for="Complemento:">Complemento:</label>
<input type="text" name="nome" id="nome" placeholder="Apto, Bloco, Ponto de Referência">
<br><br>
</fieldset>
<fieldset>
    <legend>Opções de Entrega</legend>
    <label for="Período de Entrega:">Período de Entrega:<label>
        <select name="nome" id="manha">
            <option value="">Manhã (08h-12h)</option>
            <option value="Tarde">Tarde (12h-18h)</option>
            <option value="Noite">Noite (18h-22h)</option>
        </select>
        <br><br>

<label for="Intruções de Entrega:">Instruções de Entrega:</label>
<br><br>
<input type="radio" id="portaria" name="portaria" value="portaria">
<label for="Deixar na portaria">Deixar na portaria</label>
<br>

<input type="radio" id="entrega_maos" name="entrega_maos" value="entrega_maos">
<label for="Entregar em mãos">Entregar em mãos</label>
<br>

<input type="radio" id="ligar_c" name="ligar_c" value="ligar_c">
<label for="Ligar ao chegar">Ligar ao chegar</label>
<br><br>

<label for="Cupom de Desconto:">Cupom de Desconto:</label>
<select name="Cupom_Des." id="Cupom_Des.">
    <option value="">Insira seu Cupom</option>
</select>
<br><br>
<input type="checkbox" id="nome" name="">
<label for="whatsapp">Receber ofertas por WhatsApp</label>
</fieldset>
<br>

<button>Finalizar Compra</button>
</form>
